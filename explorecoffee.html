<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Coffee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-black min-h-screen">
  <div class="w-full bg-black py-10 flex flex-col items-center" id="coffees">
    <h2 class="text-2xl font-bold text-amber-100 mb-4">Get Yourself Some Coffee</h2>
    <div class="flex flex-col sm:flex-row gap-4 mb-6 w-full max-w-2xl justify-center items-center">
      <input id="coffeeSearchInput" type="text" placeholder="Search coffee by name..." class="p-2 rounded w-full sm:w-64 border border-yellow-600 focus:outline-none focus:ring-2 focus:ring-yellow-400">
      <button id="coffeeSearchBtn" class="bg-yellow-600 hover:bg-yellow-500 text-black font-bold py-2 px-4 rounded transition">Search</button>
      <select id="coffeeSort" class="p-2 rounded border border-yellow-600 bg-black text-yellow-100">
        <option value="asc">Sort: A-Z</option>
        <option value="desc">Sort: Z-A</option>
      </select>
    </div>
    <div id="coffeeApiResult" class="w-full max-w-4xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </div>

  <script src="coffee.js"></script>
</body>
</html>

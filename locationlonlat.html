<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoffeeHub Geolocation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-black via-yellow-900 to-black min-h-screen flex items-center justify-center">
    <main class="bg-gradient-to-br from-amber-200 via-white to-yellow-100 border-2 border-amber-400 rounded-2xl shadow-2xl p-10 w-full max-w-lg text-amber-900">
        <h2 class="text-3xl font-extrabold text-amber-800 mb-6 text-center tracking-wide drop-shadow flex items-center justify-center gap-2">
          CoffeeHub Geolocation
        </h2>
        <div class="mb-6 flex flex-col items-center space-y-3">
            <button id="getLocationBtn" class="mb-4 px-6 py-2 bg-amber-700 text-white font-semibold rounded-lg shadow hover:bg-amber-900 transition flex items-center gap-2"><i class="fas fa-map-marker-alt"></i>Get Location</button>
            <p class="flex items-center justify-between w-full bg-white/80 rounded-lg px-4 py-2 shadow-sm"><span class="font-semibold text-amber-800">Latitude:</span> <span id="lat" class="font-mono text-yellow-700"></span></p>
            <p class="flex items-center justify-between w-full bg-white/80 rounded-lg px-4 py-2 shadow-sm"><span class="font-semibold text-amber-800">Longitude:</span> <span id="lon" class="font-mono text-yellow-700"></span></p>
            <p class="flex items-center justify-between w-full bg-white/80 rounded-lg px-4 py-2 shadow-sm"><span class="font-semibold text-amber-800">Timestamp:</span> <span id="timestamp" class="font-mono text-yellow-700"></span></p>
        </div>
        <div id="error" class="text-red-600 font-semibold text-center"></div>
    </main>
    <script>
        document.getElementById('getLocationBtn').onclick = function() {
            if(navigator.geolocation){
                navigator.geolocation.getCurrentPosition(getPositions, showError);
            } else {
                displayError("Browser doesn't support Geolocation");
            }
        }
        function getPositions(position){
            document.getElementById("lat").innerText = position.coords.latitude;
            document.getElementById("lon").innerText = position.coords.longitude;
            document.getElementById("timestamp").innerText = new Date(position.timestamp);
        }
        function showError(error){
            let msg = "";
            switch(error.code){
                case error.PERMISSION_DENIED:
                    msg = "User Denied Permission";
                    break;
                case error.POSITION_UNAVAILABLE:
                    msg = "Not able to fetch the user position";
                    break;
                case error.TIMEOUT:
                    msg = "Time out";
                    break;
                case error.UNKNOWN_ERROR:
                    msg = "Unknown Error";
                    break;
            }
            displayError(msg);
        }
        function displayError(msg){
            document.getElementById("error").innerText = msg;
        }
    </script>
</body>
</html>
